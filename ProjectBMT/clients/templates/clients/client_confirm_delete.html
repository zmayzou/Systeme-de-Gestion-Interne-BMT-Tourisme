{% extends 'accounts/base.html' %}

{% block title %}Supprimer client{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h3>Supprimer le client</h3>

        <p>
            واش متأكد بلي بغيتي تحذف
            <strong>{{ client.nom }} {{ client.prenom }}</strong> ؟
        </p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Oui, supprimer
            </button>

            <a href="{% url 'client_list' %}" class="btn btn-secondary">
                Annuler
            </a>
        </form>

    </div>
</div>

{% endblock %}
